<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema Biométrico - Accesos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f0; color: #1a1a1a; padding: 2rem 1rem; }
    h1 { font-size: 1.3rem; font-weight: 600; margin-bottom: 0.25rem; }
    .sub { font-size: 0.85rem; color: #666; margin-bottom: 1.5rem; }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
    .card { background: #fff; border: 0.5px solid #ddd; border-radius: 10px; padding: 1rem; text-align: center; }
    .card .label { font-size: 12px; color: #888; margin-bottom: 4px; }
    .card .value { font-size: 1.6rem; font-weight: 600; }
    .card.ok .value   { color: #0F6E56; }
    .card.deny .value { color: #A32D2D; }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
    .toolbar button { font-size: 13px; padding: 6px 14px; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
    .toolbar button.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
    .live { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #888; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
    .dot.on  { background: #1D9E75; }
    .dot.err { background: #E24B4A; }

    .table-wrap { background: #fff; border: 0.5px solid #ddd; border-radius: 10px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
    thead tr { background: #f5f5f0; border-bottom: 0.5px solid #ddd; }
    th { padding: 10px 12px; text-align: left; font-weight: 500; color: #888; }
    td { padding: 10px 12px; border-bottom: 0.5px solid #eee; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) { background: #fafaf8; }

    .badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .badge.ok   { background: #E1F5EE; color: #0F6E56; }
    .badge.deny { background: #FCEBEB; color: #A32D2D; }

    .hint { font-size: 11px; color: #aaa; text-align: right; margin-top: 6px; }

    @media (max-width: 500px) {
      th:nth-child(4), td:nth-child(4),
      th:nth-child(5), td:nth-child(5) { display: none; }
    }
  </style>
</head>
<body>

  <h1>🔐 Sistema Biométrico — Accesos</h1>
  <p class="sub">ESP32 + AS608 · Firebase Realtime Database · actualización cada 5 s</p>

  <div class="cards">
    <div class="card">
      <div class="label">Total</div>
      <div class="value" id="cnt-total">—</div>
    </div>
    <div class="card ok">
      <div class="label">Permitidos</div>
      <div class="value" id="cnt-ok">—</div>
    </div>
    <div class="card deny">
      <div class="label">Denegados</div>
      <div class="value" id="cnt-no">—</div>
    </div>
    <div class="card">
      <div class="label">Confianza prom.</div>
      <div class="value" id="cnt-conf">—</div>
    </div>
  </div>

  <div class="toolbar">
    <button class="active" onclick="setFilter('all',  this)">Todos</button>
    <button               onclick="setFilter('ok',   this)">Permitidos</button>
    <button               onclick="setFilter('deny', this)">Denegados</button>
    <div class="live">
      <span class="dot" id="dot"></span>
      <span id="live-txt">conectando...</span>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:145px">Fecha / Hora</th>
          <th style="width:95px">Estado</th>
          <th>Nombre</th>
          <th style="width:85px">CI</th>
          <th style="width:75px">Confianza</th>
        </tr>
      </thead>
      <tbody id="body">
        <tr><td colspan="5" style="text-align:center;padding:2rem;color:#aaa;">Cargando...</td></tr>
      </tbody>
    </table>
  </div>
  <p class="hint">Últimos 50 registros</p>

  <script>
    // ──────────────────────────────────────────────
    //  CONFIGURACIÓN — edita solo esta sección
    // ──────────────────────────────────────────────
    const FIREBASE_URL =
      "https://biometrico-viscarra-default-rtdb.firebaseio.com/accesos.json" +
      "?orderBy=%22timestamp_unix%22&limitToLast=50";

    // Si usas Database Secret, ponlo aquí; si las reglas son públicas, deja "".
    const DB_SECRET = "";
    // ──────────────────────────────────────────────

    let allData      = [];
    let activeFilter = 'all';

    function buildURL() {
      let url = FIREBASE_URL;
      if (DB_SECRET) url += "&auth=" + DB_SECRET;
      return url;
    }

    function setFilter(f, el) {
      activeFilter = f;
      document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      renderTable();
    }

    function renderTable() {
      const body = document.getElementById('body');
      const rows = allData
        .filter(r => {
          if (activeFilter === 'ok')   return r.permitido === true;
          if (activeFilter === 'deny') return r.permitido === false;
          return true;
        })
        .reverse();

      if (!rows.length) {
        body.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:2rem;color:#aaa;">Sin registros</td></tr>';
        return;
      }

      body.innerHTML = rows.map(r => {
        const ok   = r.permitido === true;
        const conf = r.confianza || 0;
        const confColor = conf >= 80 ? '#0F6E56' : conf >= 50 ? '#BA7517' : '#A32D2D';
        return `
          <tr>
            <td style="color:#888">${r.timestamp_local || '—'}</td>
            <td><span class="badge ${ok ? 'ok' : 'deny'}">${ok ? 'PERMITIDO' : 'DENEGADO'}</span></td>
            <td>${r.nombre || '—'}</td>
            <td style="color:#888">${r.ci || '—'}</td>
            <td style="font-weight:600;color:${confColor}">${conf > 0 ? conf + '%' : '—'}</td>
          </tr>`;
      }).join('');
    }

    function updateStats() {
      const total = allData.length;
      const ok    = allData.filter(r => r.permitido === true).length;
      const no    = allData.filter(r => r.permitido === false).length;
      const confArr = allData.filter(r => r.confianza > 0).map(r => r.confianza);
      const avg  = confArr.length ? Math.round(confArr.reduce((a,b) => a+b,0) / confArr.length) : 0;
      document.getElementById('cnt-total').textContent = total;
      document.getElementById('cnt-ok').textContent    = ok;
      document.getElementById('cnt-no').textContent    = no;
      document.getElementById('cnt-conf').textContent  = avg ? avg + '%' : '—';
    }

    async function fetchData() {
      try {
        const res  = await fetch(buildURL());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        allData = json && typeof json === 'object' ? Object.values(json) : [];
        updateStats();
        renderTable();
        const dot = document.getElementById('dot');
        dot.className = 'dot on';
        document.getElementById('live-txt').textContent = 'en vivo';
      } catch (e) {
        const dot = document.getElementById('dot');
        dot.className = 'dot err';
        document.getElementById('live-txt').textContent = 'error';
        if (!allData.length) {
          document.getElementById('body').innerHTML =
            '<tr><td colspan="5" style="text-align:center;padding:2rem;color:#c00;">' +
            'No se pudo conectar con Firebase. Revisa las reglas de acceso.' +
            '</td></tr>';
        }
      }
    }

    fetchData();
    setInterval(fetchData, 5000);
  </script>
</body>
</html>
